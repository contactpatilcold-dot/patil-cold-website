<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patil Cold - Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf3;
            color: #17213a;
        }

        .header {
            background: #071b4a;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .back-btn {
            color: #071b4a;
            background: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: 600;
        }

        .hero {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .hero h1 {
            margin: 0;
            color: #071b4a;
            font-size: 42px;
        }

        .hero p {
            margin-top: 10px;
            color: #687084;
            font-size: 17px;
        }

        .products-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 70px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        /* Flavour-specific page theme */
        body.theme-vanilla { background: #fffaf0; }
        body.theme-chocolate { background: #fbf0e9; }
        body.theme-butterscotch { background: #fff7df; }
        body.theme-mango { background: #fff6d8; }
        body.theme-strawberry { background: #fff0f3; }

        .theme-banner {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 28px;
            padding: 18px 22px;
            border-radius: 16px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #071b4a;
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(7,27,74,0.07);
        }

        body.theme-vanilla .theme-banner { background: #fff4c9; }
        body.theme-chocolate .theme-banner { background: #ead5c7; }
        body.theme-butterscotch .theme-banner { background: #ffe7a1; }
        body.theme-mango .theme-banner { background: #ffe99b; }
        body.theme-strawberry .theme-banner { background: #ffd5df; }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.12);
        }

        .product-image {
            height: 260px;
            background: #f7f7f7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .pack-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: #ef3d83;
            color: white;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .product-info {
            padding: 20px;
            flex: 1;
        }

        .pack-label {
            display: inline-block;
            width: fit-content;
            margin-bottom: 9px;
            padding: 6px 10px;
            border-radius: 20px;
            background: #071b4a;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .view-details {
            display: inline-flex;
            align-items: center;
            margin-top: 15px;
            color: #071b4a;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .product-info h3 {
            margin: 0 0 8px;
            color: #071b4a;
            font-size: 21px;
        }

        .size {
            color: #687084;
            margin-bottom: 10px;
        }

        .price-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .price {
            color: #ef3d83;
            font-size: 23px;
            font-weight: 800;
        }

        .mrp {
            color: #888;
            font-size: 14px;
            margin-left: 8px;
            text-decoration: line-through;
        }

        .description {
            color: #687084;
            font-size: 14px;
            margin-top: 10px;
            line-height: 1.5;
        }

        .product-status {
            display: inline-block;
            margin-top: 13px;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #eaf7ee;
            color: #21833b;
        }

        .loading,
        .error,
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #687084;
            font-size: 17px;
            grid-column: 1 / -1;
        }

        .error h3,
        .empty h3 {
            color: #071b4a;
            margin-bottom: 8px;
        }

        .footer {
            background: #071b4a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 1000px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .back-btn {
                padding: 8px 12px;
                font-size: 13px;
            }

            .hero {
                padding: 40px 20px 28px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 15px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .products-container {
                width: 92%;
            }

            .product-image {
                height: 280px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="logo">PATIL COLD</div>

    <a href="index.html" class="back-btn">
        ← Back to Home
    </a>
</header>

<section class="hero">
    <h1 id="flavourTitle">Our Ice Cream</h1>

    <p id="flavourSubtitle">
        Discover our delicious ice cream range.
    </p>
</section>

<div id="themeBanner" class="theme-banner" style="display:none;"></div>

<main class="products-container">

    <div id="productGrid" class="product-grid">
        <div class="loading">
            Loading delicious products...
        </div>
    </div>

</main>

<footer class="footer">
    © 2026 Patil Cold. All Rights Reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
function applyFlavourTheme(flavour) {
    const name = String(flavour || "").toLowerCase();

    document.body.classList.remove(
        "theme-vanilla",
        "theme-chocolate",
        "theme-butterscotch",
        "theme-mango",
        "theme-strawberry"
    );

    let theme = "";
    let message = "";

    if (name.includes("vanilla")) {
        theme = "theme-vanilla";
        message = "Smooth, classic and creamy — a timeless Patil Cold favourite.";
    } else if (name.includes("chocolate")) {
        theme = "theme-chocolate";
        message = "Rich, smooth and indulgently chocolatey.";
    } else if (name.includes("butterscotch")) {
        theme = "theme-butterscotch";
        message = "Creamy, caramel-inspired goodness in every scoop.";
    } else if (name.includes("mango")) {
        theme = "theme-mango";
        message = "A refreshing fruity treat with the taste of mango.";
    } else if (name.includes("strawberry")) {
        theme = "theme-strawberry";
        message = "Fruity, creamy and delightfully refreshing.";
    }

    if (theme) {
        document.body.classList.add(theme);

        const banner = document.getElementById("themeBanner");
        if (banner) {
            banner.textContent = message;
            banner.style.display = "block";
        }
    }
}


async function loadFlavourProducts() {

    const productGrid = document.getElementById("productGrid");
    const flavourTitle = document.getElementById("flavourTitle");
    const flavourSubtitle = document.getElementById("flavourSubtitle");

    const params = new URLSearchParams(window.location.search);
    const flavour = params.get("flavour");

    applyFlavourTheme(flavour);

    if (!flavour) {
        flavourTitle.textContent = "Our Ice Cream";
        flavourSubtitle.textContent = "Please select a flavour.";

        productGrid.innerHTML = `
            <div class="empty">
                <h3>No flavour selected.</h3>
                <p>Please return to the home page and select a flavour.</p>
            </div>
        `;

        return;
    }

    flavourTitle.textContent = flavour + " Ice Cream";
    flavourSubtitle.textContent =
        "Choose your favourite " + flavour.toLowerCase() + " ice cream.";

    const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .eq("flavour", flavour)
        .eq("available", true)
        .order("sort_order", { ascending: true })
        .order("price", { ascending: true });

    if (error) {
        console.error(error);

        productGrid.innerHTML = `
            <div class="error">
                <h3>Unable to load products</h3>
                <p>Please try again later.</p>
            </div>
        `;

        return;
    }

    if (!data || data.length === 0) {
        productGrid.innerHTML = `
            <div class="empty">
                <h3>No ${escapeHtml(flavour)} products available.</h3>
                <p>Please check back soon.</p>
            </div>
        `;

        return;
    }

    productGrid.innerHTML = "";

    data.forEach(function(product) {

        const card = document.createElement("article");
        card.className = "product-card";

        const fallbackImage = getFlavourImage(product.flavour);

        const imageUrl =
            product.image_url && product.image_url.trim()
                ? product.image_url
                : fallbackImage;

        const mrpHtml =
            product.mrp &&
            Number(product.mrp) > Number(product.price)
                ? `
                    <span class="mrp">
                        ₹${formatPrice(product.mrp)}
                    </span>
                `
                : "";

        const featuredBadge =
            product.featured
                ? `<span class="pack-badge">Featured</span>`
                : "";

        card.innerHTML = `
            <div class="product-image">

                <img
                    src="${escapeHtml(imageUrl)}"
                    alt="Patil Cold ${escapeHtml(product.flavour)} ${escapeHtml(product.size)}"
                    loading="lazy"
                    onerror="this.onerror=null; this.src='${escapeHtml(fallbackImage)}';"
                >

                ${featuredBadge}

            </div>

            <div class="product-info">

                <span class="pack-label">
                    ${escapeHtml(product.size)} Pack
                </span>

                <h3>
                    ${escapeHtml(product.product_name)}
                </h3>

                <div class="size">
                    Pack Size:
                    <strong>${escapeHtml(product.size)}</strong>
                </div>

                <div class="price-row">

                    <span class="price">
                        ₹${formatPrice(product.price)}
                    </span>

                    ${mrpHtml}

                </div>

                <div class="description">
                    ${escapeHtml(
                        product.description ||
                        "Delicious and creamy ice cream."
                    )}
                </div>

                <span class="product-status">
                    Available
                </span>

                <span class="view-details">
                    Product Details →
                </span>

            </div>
        `;

        productGrid.appendChild(card);
    });
}


function formatPrice(value) {
    const number = Number(value);

    if (Number.isNaN(number)) {
        return "0";
    }

    return Number.isInteger(number)
        ? number.toString()
        : number.toFixed(2);
}


function getFlavourImage(flavour) {

    const name = String(flavour || "").toLowerCase();

    if (name.includes("vanilla"))
        return "assets/products/vanilla.png";

    if (name.includes("chocolate"))
        return "assets/products/chocolate.png";

    if (name.includes("butterscotch"))
        return "assets/products/butterscotch.png";

    if (name.includes("mango"))
        return "assets/products/mango.png";

    if (name.includes("strawberry"))
        return "assets/products/strawberry.png";

    return "";
}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


loadFlavourProducts();
</script>

</body>
</html>
