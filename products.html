<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patil Cold - Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf3;
            color: #17213a;
        }

        .header {
            background: #071b4a;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .back-btn {
            color: #071b4a;
            background: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: 600;
        }

        .hero {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .hero h1 {
            margin: 0;
            color: #071b4a;
            font-size: 42px;
        }

        .hero p {
            margin-top: 10px;
            color: #687084;
            font-size: 17px;
        }

        .products-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 70px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-6px);
        }

        .product-image {
            height: 260px;
            background: #f7f7f7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            margin: 0 0 8px;
            color: #071b4a;
            font-size: 21px;
        }

        .size {
            color: #687084;
            margin-bottom: 10px;
        }

        .price {
            color: #ef3d83;
            font-size: 23px;
            font-weight: 800;
        }

        .mrp {
            color: #888;
            font-size: 14px;
            margin-left: 8px;
            text-decoration: line-through;
        }

        .description {
            color: #687084;
            font-size: 14px;
            margin-top: 10px;
            line-height: 1.5;
        }

        .loading,
        .error,
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #687084;
            font-size: 17px;
        }

        .footer {
            background: #071b4a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 900px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .products-container {
                width: 92%;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">
        PATIL COLD
    </div>

    <a href="index.html" class="back-btn">
        ← Back to Home
    </a>

</header>


<section class="hero">

    <h1 id="flavourTitle">
        Our Ice Cream
    </h1>

    <p id="flavourSubtitle">
        Discover our delicious ice cream range.
    </p>

</section>


<main class="products-container">

    <div id="productGrid" class="product-grid">

        <div class="loading">
            Loading delicious products...
        </div>

    </div>

</main>


<footer class="footer">

    © 2026 Patil Cold. All Rights Reserved.

</footer>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>

async function loadFlavourProducts() {

    const productGrid =
        document.getElementById("productGrid");

    const flavourTitle =
        document.getElementById("flavourTitle");

    const flavourSubtitle =
        document.getElementById("flavourSubtitle");


    // Get flavour from URL

    const params =
        new URLSearchParams(window.location.search);

    const flavour =
        params.get("flavour");


    if (!flavour) {

        flavourTitle.textContent =
            "Our Ice Cream";

        flavourSubtitle.textContent =
            "Please select a flavour.";

        productGrid.innerHTML = `
            <div class="empty">
                No flavour selected.
            </div>
        `;

        return;
    }


    flavourTitle.textContent =
        flavour + " Ice Cream";

    flavourSubtitle.textContent =
        "Choose your favourite " +
        flavour.toLowerCase() +
        " ice cream.";


    // Get products from Supabase

    const { data, error } =
        await supabaseClient
            .from("products")
            .select("*")
            .eq("flavour", flavour)
            .eq("available", true)
            .order("sort_order", {
                ascending: true
            })
            .order("price", {
                ascending: true
            });


    if (error) {

        console.error(error);

        productGrid.innerHTML = `
            <div class="error">
                <h3>Unable to load products</h3>
                <p>${error.message}</p>
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        productGrid.innerHTML = `
            <div class="empty">
                <h3>No ${flavour} products available.</h3>
                <p>Please check back soon.</p>
            </div>
        `;

        return;
    }


    productGrid.innerHTML = "";


    data.forEach(function(product) {

        const card =
            document.createElement("div");

        card.className =
            "product-card";


        const fallbackImage =
            getFlavourImage(product.flavour);


        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${product.image_url || fallbackImage}"
                    alt="Patil Cold ${product.flavour} ${product.size}"
                    loading="lazy"
                    onerror="this.onerror=null; this.src='${fallbackImage}'"
                >

            </div>


            <div class="product-info">

                <h3>
                    ${escapeHtml(product.product_name)}
                </h3>


                <div class="size">
                    Pack Size: <strong>
                        ${escapeHtml(product.size)}
                    </strong>
                </div>


                <div class="price">

                    ₹${Number(product.price).toFixed(0)}

                    ${
                        product.mrp &&
                        Number(product.mrp) >
                        Number(product.price)

                        ? `
                            <span class="mrp">
                                ₹${Number(product.mrp).toFixed(0)}
                            </span>
                        `
                        : ""
                    }

                </div>


                <div class="description">

                    ${
                        escapeHtml(
                            product.description ||
                            "Delicious and creamy ice cream."
                        )
                    }

                </div>

            </div>

        `;


        productGrid.appendChild(card);

    });

}


function getFlavourImage(flavour) {

    const name =
        flavour.toLowerCase();


    if (name.includes("vanilla"))
        return "assets/products/vanilla.png";

    if (name.includes("chocolate"))
        return "assets/products/chocolate.png";

    if (name.includes("butterscotch"))
        return "assets/products/butterscotch.png";

    if (name.includes("mango"))
        return "assets/products/mango.png";

    if (name.includes("strawberry"))
        return "assets/products/strawberry.png";

    return "";
}


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadFlavourProducts();

</script>

</body>
</html>
