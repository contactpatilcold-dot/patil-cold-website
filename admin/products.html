<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patil Cold - Manage Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #222;
        }

        .header {
            background: #071d49;
            color: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 23px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header button,
        .header a {
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }

        .back-btn {
            background: white;
            color: #071d49;
        }

        .logout-btn {
            background: #e91e63;
            color: white;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-title h2 {
            color: #071d49;
            margin: 0;
        }

        .add-btn {
            background: #071d49;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            display: none;
        }

        .form-box.active {
            display: block;
        }

        .form-box h3 {
            margin-top: 0;
            color: #071d49;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #071d49;
        }

        .checkbox-group {
            display: flex;
            gap: 25px;
            align-items: center;
            margin-top: 10px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 500;
        }

        .checkbox-group input {
            width: auto;
        }

        .form-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .save-btn {
            background: #071d49;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .cancel-btn {
            background: #ddd;
            color: #333;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            font-weight: 600;
        }

        .table-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #071d49;
            color: white;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .status {
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .available {
            background: #dff7e5;
            color: #16803c;
        }

        .unavailable {
            background: #ffe1e1;
            color: #c62828;
        }

        .featured {
            color: #d89b00;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .edit-btn {
            background: #e8eefc;
            color: #071d49;
        }

        .delete-btn {
            background: #ffe1e1;
            color: #c62828;
        }

        .loading {
            padding: 30px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 700px) {

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .header-actions a,
            .header-actions button {
                padding: 8px 10px;
                font-size: 12px;
            }

            .container {
                padding: 0 12px;
            }

            .page-title {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <h1>PATIL COLD — Products</h1>

    <div class="header-actions">

        <a href="dashboard.html" class="back-btn">
            Dashboard
        </a>

        <button class="logout-btn" id="logoutBtn">
            Logout
        </button>

    </div>

</header>


<main class="container">

    <div class="page-title">

        <h2>Manage Products</h2>

        <button class="add-btn" id="addProductBtn">
            + Add Product
        </button>

    </div>


    <!-- PRODUCT FORM -->

    <div class="form-box" id="productFormBox">

        <h3 id="formTitle">Add New Product</h3>

        <form id="productForm">

            <input type="hidden" id="productId">

            <div class="form-grid">

                <div class="form-group">
                    <label>Product Name</label>
                    <input
                        type="text"
                        id="productName"
                        placeholder="Example: Vanilla Ice Cream"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Flavour</label>

                    <select id="flavour" required>

                        <option value="">Select Flavour</option>
                        <option value="Vanilla">Vanilla</option>
                        <option value="Chocolate">Chocolate</option>
                        <option value="Butterscotch">Butterscotch</option>
                        <option value="Mango">Mango</option>
                        <option value="Strawberry">Strawberry</option>
                        <option value="Kesar Pista">Kesar Pista</option>
                        <option value="Rajbhog">Rajbhog</option>
                        <option value="Black Currant">Black Currant</option>
                        <option value="Choco Chips">Choco Chips</option>
                        <option value="Kulfi">Kulfi</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Pack Size</label>

                    <input
                        type="text"
                        id="size"
                        placeholder="Example: 40 ml"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Selling Price (₹)</label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        placeholder="Example: 10"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>MRP (₹)</label>

                    <input
                        type="number"
                        id="mrp"
                        min="0"
                        step="0.01"
                        placeholder="Example: 10"
                    >

                </div>


                <div class="form-group">

                    <label>Display Order</label>

                    <input
                        type="number"
                        id="sortOrder"
                        min="0"
                        value="0"
                    >

                </div>


                <div class="form-group full">

                    <label>Description</label>

                    <textarea
                        id="description"
                        placeholder="Enter product description"
                    ></textarea>

                    <div class="form-group">
    <label for="image_url">Image URL</label>
    <input
        type="url"
        id="image_url"
        placeholder="Paste product image URL"
    >
</div>

                </div>

            </div>


            <div class="checkbox-group">

                <label>
                    <input type="checkbox" id="available" checked>
                    Available
                </label>

                <label>
                    <input type="checkbox" id="featured">
                    Featured
                </label>

            </div>


            <div class="form-buttons">

                <button type="submit" class="save-btn">
                    Save Product
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn"
                >
                    Cancel
                </button>

            </div>


            <div class="message" id="formMessage"></div>

        </form>

    </div>


    <!-- PRODUCT TABLE -->

    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>Product</th>
                    <th>Flavour</th>
                    <th>Size</th>
                    <th>Price</th>
                    <th>MRP</th>
                    <th>Status</th>
                    <th>Featured</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="productTableBody">

                <tr>
                    <td colspan="8" class="loading">
                        Loading products...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>


<script>

let editingProductId = null;


// ================================
// CHECK ADMIN
// ================================

async function checkAdmin() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href = "index.html";

        return false;
    }


    const { data: adminUser, error } =
        await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", session.user.id)
            .maybeSingle();


    if (error || !adminUser) {

        await supabaseClient.auth.signOut();

        window.location.href = "index.html";

        return false;
    }


    return true;
}


// ================================
// LOAD PRODUCTS
// ================================

async function loadProducts() {

    const tableBody =
        document.getElementById("productTableBody");


    tableBody.innerHTML = `
        <tr>
            <td colspan="8" class="loading">
                Loading products...
            </td>
        </tr>
    `;


    const { data, error } =
        await supabaseClient
            .from("products")
            .select("*")
            .order("sort_order", { ascending: true })
            .order("created_at", { ascending: false });


    if (error) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="8" class="loading">
                    Error: ${error.message}
                </td>
            </tr>
        `;

        return;
    }


    if (!data || data.length === 0) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="8" class="loading">
                    No products found.
                </td>
            </tr>
        `;

        return;
    }


    tableBody.innerHTML = "";


    data.forEach(function(product) {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                <strong>${escapeHtml(product.product_name)}</strong>
            </td>

            <td>
                ${escapeHtml(product.flavour)}
            </td>

            <td>
                ${escapeHtml(product.size)}
            </td>

            <td>
                ₹${Number(product.price).toFixed(2)}
            </td>

            <td>
                ${product.mrp !== null
                    ? "₹" + Number(product.mrp).toFixed(2)
                    : "-"
                }
            </td>

            <td>

                <span class="status ${
                    product.available
                        ? "available"
                        : "unavailable"
                }">

                    ${
                        product.available
                            ? "Available"
                            : "Hidden"
                    }

                </span>

            </td>

            <td>

                ${
                    product.featured
                        ? '<span class="featured">★ Yes</span>'
                        : "No"
                }

            </td>

            <td>

                <div class="actions">

                    <button
                        class="edit-btn"
                        onclick="editProduct(${product.id})"
                    >
                        Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteProduct(${product.id})"
                    >
                        Delete
                    </button>

                </div>

            </td>

        `;


        tableBody.appendChild(row);

    });

}


// ================================
// ADD PRODUCT BUTTON
// ================================

document
    .getElementById("addProductBtn")
    .addEventListener("click", function() {

        editingProductId = null;

        document
            .getElementById("productForm")
            .reset();

        document
            .getElementById("available")
            .checked = true;

        document
            .getElementById("formTitle")
            .textContent = "Add New Product";

        document
            .getElementById("productFormBox")
            .classList.add("active");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    });


// ================================
// CANCEL
// ================================

document
    .getElementById("cancelBtn")
    .addEventListener("click", function() {

        closeForm();

    });


function closeForm() {

    document
        .getElementById("productFormBox")
        .classList.remove("active");

    document
        .getElementById("productForm")
        .reset();

    editingProductId = null;

}


// ================================
// SAVE PRODUCT
// ================================

document
    .getElementById("productForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const productData = {

            product_name:
                document.getElementById("productName").value.trim(),

            flavour:
                document.getElementById("flavour").value,

            size:
                document.getElementById("size").value.trim(),

            price:
                Number(document.getElementById("price").value),

            mrp:
                document.getElementById("mrp").value
                    ? Number(document.getElementById("mrp").value)
                    : null,

            description:
                document.getElementById("description").value.trim(),

            available:
                document.getElementById("available").checked,

            featured:
                document.getElementById("featured").checked,

            sort_order:
    Number(document.getElementById("sortOrder").value) || 0,

image_url:
    document.getElementById("image_url").value.trim()
};


        const message =
            document.getElementById("formMessage");


        message.style.color = "#333";
        message.textContent = "Saving...";


        let result;


        if (editingProductId) {

            result =
                await supabaseClient
                    .from("products")
                    .update(productData)
                    .eq("id", editingProductId);

        } else {

            result =
                await supabaseClient
                    .from("products")
                    .insert(productData);

        }


        if (result.error) {

            message.style.color = "red";
            message.textContent =
                result.error.message;

            return;
        }


        message.style.color = "green";
        message.textContent =
            "Product saved successfully!";


        await loadProducts();


        setTimeout(function() {

            closeForm();

        }, 800);

    });


// ================================
// EDIT PRODUCT
// ================================

async function editProduct(id) {

    const { data, error } =
        await supabaseClient
            .from("products")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert(error.message);

        return;
    }


    editingProductId = id;


    document.getElementById("productName").value =
        data.product_name || "";

    document.getElementById("flavour").value =
        data.flavour || "";

    document.getElementById("size").value =
        data.size || "";

    document.getElementById("price").value =
        data.price || "";

    document.getElementById("mrp").value =
        data.mrp || "";

    document.getElementById("description").value =
        data.description || "";

    document.getElementById("available").checked =
        data.available;

    document.getElementById("featured").checked =
        data.featured;

    document.getElementById("sortOrder").value =
        data.sort_order || 0;


    document.getElementById("formTitle").textContent =
        "Edit Product";


    document
        .getElementById("productFormBox")
        .classList.add("active");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ================================
// DELETE PRODUCT
// ================================

async function deleteProduct(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmDelete) return;


    const { error } =
        await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "Delete failed: " +
            error.message
        );

        return;
    }


    alert("Product deleted successfully.");

    loadProducts();

}


// ================================
// LOGOUT
// ================================

document
    .getElementById("logoutBtn")
    .addEventListener("click", async function() {

        await supabaseClient.auth.signOut();

        window.location.href = "index.html";

    });


// ================================
// SECURITY HELPER
// ================================

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ================================
// START
// ================================

(async function() {

    const authorized = await checkAdmin();

    if (authorized) {
        await loadProducts();
    }

})();

</script>

</body>
</html>
