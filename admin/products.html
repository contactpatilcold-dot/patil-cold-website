<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patil Cold - Manage Products</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#222}.header{background:#071d49;color:#fff;padding:16px 30px;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:23px}.header-actions{display:flex;gap:10px}.header button,.header a{border:0;padding:9px 15px;border-radius:6px;text-decoration:none;cursor:pointer;font-weight:600}.back-btn{background:#fff;color:#071d49}.logout-btn{background:#e91e63;color:#fff}.container{max-width:1250px;margin:30px auto;padding:0 20px}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.page-title h2{color:#071d49;margin:0}.add-btn,.save-btn{background:#071d49;color:#fff;border:0;padding:12px 20px;border-radius:7px;cursor:pointer;font-weight:600}.form-box,.table-box{background:#fff;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,.08)}.form-box{padding:25px;margin-bottom:30px;display:none}.form-box.active{display:block}.form-box h3{margin-top:0;color:#071d49}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.form-group{display:flex;flex-direction:column}.form-group.full{grid-column:1/-1}label{margin-bottom:7px;font-weight:600}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:7px;font-size:15px}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{outline:none;border-color:#071d49}.checkbox-group{display:flex;gap:25px;align-items:center;margin-top:10px}.checkbox-group label{display:flex;align-items:center;gap:7px;font-weight:500}.checkbox-group input{width:auto}.form-buttons{margin-top:20px;display:flex;gap:10px}.cancel-btn{background:#ddd;color:#333;border:0;padding:12px 22px;border-radius:7px;cursor:pointer;font-weight:600}.message{margin-top:15px;font-weight:600}.table-box{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:14px;text-align:left;border-bottom:1px solid #eee}th{background:#071d49;color:#fff;font-size:14px}td{font-size:14px}.status{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:600}.available{background:#dff7e5;color:#16803c}.unavailable{background:#ffe1e1;color:#c62828}.featured{color:#d89b00;font-weight:700}.actions{display:flex;gap:7px}.edit-btn,.delete-btn{border:0;padding:7px 10px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600}.edit-btn{background:#e8eefc;color:#071d49}.delete-btn{background:#ffe1e1;color:#c62828}.loading{padding:30px;text-align:center;color:#777}.image-upload-box{display:flex;flex-direction:column;gap:10px}.image-preview{width:150px;height:150px;border:1px dashed #bbb;border-radius:8px;object-fit:contain;background:#fafafa;display:none;padding:8px}.upload-status{font-size:13px;color:#666;min-height:18px}.upload-status.success{color:#16803c}.upload-status.error{color:#c62828}.help-text{font-size:12px;color:#777;margin-top:2px}@media(max-width:700px){.header{padding:15px}.header h1{font-size:18px}.header-actions a,.header-actions button{padding:8px 10px;font-size:12px}.container{padding:0 12px}.page-title{align-items:flex-start;gap:15px;flex-direction:column}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}}
</style>
</head>
<body>
<header class="header">
<h1>PATIL COLD — Products</h1>
<div class="header-actions"><a href="dashboard.html" class="back-btn">Dashboard</a><button class="logout-btn" id="logoutBtn">Logout</button></div>
</header>
<main class="container">
<div class="page-title"><h2>Manage Products</h2><button class="add-btn" id="addProductBtn">+ Add Product</button></div>
<div class="form-box" id="productFormBox">
<h3 id="formTitle">Add New Product</h3>
<form id="productForm">
<input type="hidden" id="productId">
<div class="form-grid">
<div class="form-group"><label for="productName">Product Name</label><input type="text" id="productName" placeholder="Example: Vanilla Ice Cream" required></div>
<div class="form-group"><label for="flavour">Flavour</label><select id="flavour" required><option value="">Select Flavour</option><option>Vanilla</option><option>Chocolate</option><option>Butterscotch</option><option>Mango</option><option>Strawberry</option><option>Kesar Pista</option><option>Rajbhog</option><option>Black Currant</option><option>Choco Chips</option><option>Kulfi</option></select></div>
<div class="form-group"><label for="size">Pack Size</label><input type="text" id="size" placeholder="Example: 40 ml" required></div>
<div class="form-group"><label for="price">Selling Price (₹)</label><input type="number" id="price" min="0" step="0.01" placeholder="Example: 10" required></div>
<div class="form-group"><label for="mrp">MRP (₹)</label><input type="number" id="mrp" min="0" step="0.01" placeholder="Example: 10"></div>
<div class="form-group"><label for="sortOrder">Display Order</label><input type="number" id="sortOrder" min="0" value="0"></div>
<div class="form-group full"><label for="description">Description</label><textarea id="description" placeholder="Enter product description"></textarea></div>
<div class="form-group full"><label for="imageFile">Product Image</label><div class="image-upload-box"><input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp"><img id="imagePreview" class="image-preview" alt="Product image preview"><div id="uploadStatus" class="upload-status">Select a PNG, JPG or WebP image.</div><div class="help-text">Maximum 5 MB. A new image is uploaded only when you select a new file.</div><input type="hidden" id="image_url"></div></div>
</div>
<div class="checkbox-group"><label><input type="checkbox" id="available" checked> Available</label><label><input type="checkbox" id="featured"> Featured</label></div>
<div class="form-buttons"><button type="submit" class="save-btn" id="saveBtn">Save Product</button><button type="button" class="cancel-btn" id="cancelBtn">Cancel</button></div>
<div class="message" id="formMessage"></div>
</form>
</div>
<div class="table-box"><table><thead><tr><th>Product</th><th>Flavour</th><th>Size</th><th>Price</th><th>MRP</th><th>Status</th><th>Featured</th><th>Actions</th></tr></thead><tbody id="productTableBody"><tr><td colspan="8" class="loading">Loading products...</td></tr></tbody></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script>
let editingProductId=null;
const BUCKET="product-image";
const $=id=>document.getElementById(id);

async function checkAdmin(){
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(!session){location.href="index.html";return false;}
 const {data:adminUser,error}=await supabaseClient.from("admin_users").select("user_id").eq("user_id",session.user.id).maybeSingle();
 if(error||!adminUser){await supabaseClient.auth.signOut();location.href="index.html";return false;}
 return true;
}

async function loadProducts(){
 const body=$("productTableBody");
 body.innerHTML='<tr><td colspan="8" class="loading">Loading products...</td></tr>';
 const {data,error}=await supabaseClient.from("products").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:false});
 if(error){body.innerHTML='<tr><td colspan="8" class="loading">Error: '+escapeHtml(error.message)+'</td></tr>';return;}
 if(!data||!data.length){body.innerHTML='<tr><td colspan="8" class="loading">No products found.</td></tr>';return;}
 body.innerHTML="";
 data.forEach(product=>{
  const row=document.createElement("tr");
  row.innerHTML=`<td><strong>${escapeHtml(product.product_name)}</strong></td><td>${escapeHtml(product.flavour)}</td><td>${escapeHtml(product.size)}</td><td>₹${Number(product.price).toFixed(2)}</td><td>${product.mrp!==null&&product.mrp!==undefined?"₹"+Number(product.mrp).toFixed(2):"-"}</td><td><span class="status ${product.available?"available":"unavailable"}">${product.available?"Available":"Hidden"}</span></td><td>${product.featured?'<span class="featured">★ Yes</span>':"No"}</td><td><div class="actions"><button class="edit-btn" onclick="editProduct(${product.id})">Edit</button><button class="delete-btn" onclick="deleteProduct(${product.id})">Delete</button></div></td>`;
  body.appendChild(row);
 });
}

$("addProductBtn").addEventListener("click",()=>{
 editingProductId=null;
 $("productForm").reset();
 resetImageUpload();
 $("available").checked=true;
 $("formTitle").textContent="Add New Product";
 $("formMessage").textContent="";
 $("productFormBox").classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
});
$("cancelBtn").addEventListener("click",closeForm);
function closeForm(){ $("productFormBox").classList.remove("active");$("productForm").reset();resetImageUpload();editingProductId=null;$("formMessage").textContent=""; }

$("imageFile").addEventListener("change",function(){
 const file=this.files[0];
 if(!file){return;}
 if(!["image/png","image/jpeg","image/webp"].includes(file.type)){this.value="";hidePreview();setUploadStatus("Please select a PNG, JPG or WebP image.","error");return;}
 if(file.size>5*1024*1024){this.value="";hidePreview();setUploadStatus("Image must be smaller than 5 MB.","error");return;}
 const oldUrl=$("imagePreview").dataset.objectUrl;
 if(oldUrl)URL.revokeObjectURL(oldUrl);
 const url=URL.createObjectURL(file);$("imagePreview").dataset.objectUrl=url;$("imagePreview").src=url;$("imagePreview").style.display="block";setUploadStatus("Image selected. It will upload when you save the product.","");
});
function setUploadStatus(text,type){const el=$("uploadStatus");el.className="upload-status"+(type?" "+type:"");el.textContent=text;}
function hidePreview(){const img=$("imagePreview");const oldUrl=img.dataset.objectUrl;if(oldUrl)URL.revokeObjectURL(oldUrl);img.dataset.objectUrl="";img.src="";img.style.display="none";}
function resetImageUpload(){hidePreview();$("imageFile").value="";$("image_url").value="";setUploadStatus("Select a PNG, JPG or WebP image.","");}

async function uploadProductImage(){
 const file=$("imageFile").files[0];
 // Editing without selecting a new file keeps the existing URL.
 if(!file)return $("image_url").value.trim()||null;
 const extension=(file.name.split(".").pop()||"jpg").toLowerCase();
 const base=(file.name.replace(/\.[^/.]+$/," ").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").substring(0,60)||"product-image");
 const uniqueName=`${base}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${extension}`;
 setUploadStatus("Uploading image...","");
 const {error}=await supabaseClient.storage.from(BUCKET).upload(uniqueName,file,{cacheControl:"3600",upsert:false,contentType:file.type});
 if(error)throw new Error("Image upload failed: "+error.message);
 const {data}=supabaseClient.storage.from(BUCKET).getPublicUrl(uniqueName);
 if(!data||!data.publicUrl)throw new Error("Could not create the public image URL.");
 $("image_url").value=data.publicUrl;
 setUploadStatus("Image uploaded successfully.","success");
 return data.publicUrl;
}

$("productForm").addEventListener("submit",async function(e){
 e.preventDefault();
 const message=$("formMessage"),saveBtn=$("saveBtn");
 message.style.color="#333";message.textContent="Preparing product...";saveBtn.disabled=true;saveBtn.textContent="Saving...";
 try{
  const imageUrl=await uploadProductImage();
  const productData={product_name:$("productName").value.trim(),flavour:$("flavour").value,size:$("size").value.trim(),price:Number($("price").value),mrp:$("mrp").value?Number($("mrp").value):null,description:$("description").value.trim(),available:$("available").checked,featured:$("featured").checked,sort_order:Number($("sortOrder").value)||0,image_url:imageUrl};
  let result;
  if(editingProductId)result=await supabaseClient.from("products").update(productData).eq("id",editingProductId);
  else result=await supabaseClient.from("products").insert(productData);
  if(result.error)throw new Error(result.error.message);
  message.style.color="green";message.textContent="Product saved successfully!";await loadProducts();setTimeout(closeForm,700);
 }catch(err){console.error(err);message.style.color="red";message.textContent=err.message;setUploadStatus(err.message,"error");}
 finally{saveBtn.disabled=false;saveBtn.textContent="Save Product";}
});

async function editProduct(id){
 const {data,error}=await supabaseClient.from("products").select("*").eq("id",id).single();
 if(error){alert(error.message);return;}
 editingProductId=id;
 $("productName").value=data.product_name||"";$("flavour").value=data.flavour||"";$("size").value=data.size||"";$("price").value=data.price??"";$("mrp").value=data.mrp??"";$("description").value=data.description||"";$("image_url").value=data.image_url||"";$("available").checked=!!data.available;$("featured").checked=!!data.featured;$("sortOrder").value=data.sort_order??0;
 $("imageFile").value="";
 hidePreview();
 if(data.image_url){$("imagePreview").src=data.image_url;$("imagePreview").style.display="block";setUploadStatus("Current product image. Select a new file to replace it.","success");}else setUploadStatus("No image saved. Select a PNG, JPG or WebP image.","");
 $("formTitle").textContent="Edit Product";$("formMessage").textContent="";$("productFormBox").classList.add("active");window.scrollTo({top:0,behavior:"smooth"});
}
window.editProduct=editProduct;

async function deleteProduct(id){
 if(!confirm("Are you sure you want to delete this product?"))return;
 const {error}=await supabaseClient.from("products").delete().eq("id",id);
 if(error){alert("Delete failed: "+error.message);return;}
 alert("Product deleted successfully.");loadProducts();
}
window.deleteProduct=deleteProduct;

$("logoutBtn").addEventListener("click",async()=>{await supabaseClient.auth.signOut();location.href="index.html";});
function escapeHtml(value){return value==null?"":String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

(async()=>{const authorized=await checkAdmin();if(authorized)await loadProducts();})();
</script>
</body>
</html>
